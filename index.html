<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fields of Illusion - Whack-a-Mole</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      font-family: 'Segoe UI', sans-serif;
    }

    .container {
      position: relative;
      height: 100%;
      background: url('https://images.freeimages.com/images/large-previews/76e/green-field-landscape-1337336.jpg') no-repeat centre centre/cover;
      cursor: pointer;
    }

    #scoreBoard {
      position: absolute;
      top: 20px;
      left: 20px;
      colour: white;
      font-size: 1.5rem;
      text-shadow: 1px 1px 5px black;
    }

    #startBtn {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      padding: 0.5rem 1rem;
      font-size: 1rem;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      box-shadow: 1px 1px 5px rgba(0,0,0,0.5);
    }

    .mole {
      position: absolute;
      width: 100px;
      height: 100px;
      pointer-events: auto;
      cursor: pointer;
      user-select: none;
      transition: transform 0.1s ease-out;
    }
  </style>
</head>
<body>
  <div class="container" id="field">
    <div id="scoreBoard">Score: 0</div>
    <button id="startBtn">Start Game</button>
  </div>

  <!-- Whack sound -->
  <audio id="whackSound" preload="auto">
    <source src="https://www.soundjay.com/button/sounds/button-16.mp3" type="audio/mpeg">
  </audio>

  <script>
    const field = document.getElementById('field');
    const scoreBoard = document.getElementById('scoreBoard');
    const startBtn = document.getElementById('startBtn');
    const whackSound = document.getElementById('whackSound');

    let score = 0;
    let timeUp = false;
    const spawnInterval = 3000; // fixed 3-second spawn

    function randomBetween(min, max) {
      return Math.random() * (max - min) + min;
    }

    function updateScore() {
      scoreBoard.textContent = `Score: ${score}`;
    }

    function whack(event) {
      score++;
      updateScore();
      whackSound.currentTime = 0;
      whackSound.play().catch(() => {});
      this.style.transform = 'scale(0.8)';
      setTimeout(() => this.remove(), 100);
    }

    function showMole() {
      const mole = document.createElement('img');
      mole.src = 'https://freeimage.host/i/3hkjKYv';
      mole.className = 'mole';
      const size = randomBetween(80, 120);
      mole.style.width = `${size}px`;
      mole.style.height = `${size}px`;

      const { width, height } = field.getBoundingClientRect();
      const x = randomBetween(0, width - size);
      const y = randomBetween(0, height - size);
      mole.style.left = `${x}px`;
      mole.style.top = `${y}px`;

      mole.addEventListener('click', whack);
      field.appendChild(mole);

      setTimeout(() => {
        if (!timeUp) {
          mole.remove();
          showMole();
        }
      }, spawnInterval);
    }

    function startGame() {
      score = 0;
      updateScore();
      timeUp = false;
      startBtn.disabled = true;

      showMole();
      setTimeout(() => {
        timeUp = true;
        startBtn.disabled = false;
      }, 30000);
    }

    startBtn.addEventListener('click', startGame);
  </script>
</body>
</html>
