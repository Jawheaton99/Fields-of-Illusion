<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fields of Illusion</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      font-family: 'Segoe UI', sans-serif;
    }

    .container {
      position: relative;
      height: 100%;
      background: url('https://images.freeimages.com/images/large-previews/76e/green-field-landscape-1337336.jpg') no-repeat center center/cover;
      cursor: pointer;
    }

    h1 {
      position: absolute;
      top: 30px;
      left: 50%;
      transform: translateX(-50%);
      color: white;
      font-size: 3rem;
      text-shadow: 2px 2px 10px black;
    }

    .magic {
      position: absolute;
      border-radius: 50%;
      pointer-events: none;
      animation: sparkle 800ms ease-out forwards;
    }

    @keyframes sparkle {
      0% {
        opacity: 1;
        transform: translate(0, 0) scale(1);
        filter: blur(0px);
      }
      50% {
        opacity: 0.7;
        transform: translate(var(--dx), var(--dy)) scale(var(--scale));
        filter: blur(2px);
      }
      100% {
        opacity: 0;
        transform: translate(calc(var(--dx) * 2), calc(var(--dy) * 2)) scale(var(--scale));
        filter: blur(4px);
      }
    }
  </style>
</head>
<body>
  <div class="container" id="field">
    <h1>Fields of Illusion</h1>
  </div>

  <!-- Background music embed -->
  <iframe id="bgMusic" src="https://www.youtube.com/embed/6xUnSVTh8fI?autoplay=1&loop=1&playlist=6xUnSVTh8fI&controls=0&modestbranding=1" frameborder="0" allow="autoplay" style="display:none;"></iframe>

  <!-- Magic click sound for effects -->
  <audio id="magicSound" preload="auto" playsinline>
    <source src="https://www.soundjay.com/magic/sounds/magic-chime-01.mp3" type="audio/mpeg">
    Your browser does not support the audio element.
  </audio>

  <script>
    const field = document.getElementById('field');
    const sound = document.getElementById('magicSound');

    function randomBetween(min, max) {
      return Math.random() * (max - min) + min;
    }

    // Ensure YouTube iframe starts playing
    window.addEventListener('load', () => {
      const iframe = document.getElementById('bgMusic');
      // postMessage to play (some browsers restrict autoplay otherwise)
      iframe.contentWindow.postMessage('{"event":"command","func":"playVideo","args":""}', '*');
    });

    field.addEventListener('click', e => {
      sound.currentTime = 0;
      sound.play().catch(err => console.warn('Audio play blocked:', err));

      const colours = ['#ffffff', '#fffa72', '#b0eacd', '#c3baff'];
      const count = 20;
      for (let i = 0; i < count; i++) {
        const magic = document.createElement('div');
        magic.classList.add('magic');
        const size = randomBetween(10, 30);
        magic.style.width = `${size}px`;
        magic.style.height = `${size}px`;
        magic.style.background = colours[Math.floor(Math.random() * colours.length)];
        const angle = randomBetween(0, 2 * Math.PI);
        const dx = Math.cos(angle) * randomBetween(20, 80) + 'px';
        const dy = Math.sin(angle) * randomBetween(20, 80) + 'px';
        magic.style.setProperty('--dx', dx);
        magic.style.setProperty('--dy', dy);
        magic.style.setProperty('--scale', randomBetween(0.8, 1.5));
        magic.style.left = `${e.clientX - size/2}px`;
        magic.style.top = `${e.clientY - size/2}px`;
        document.body.appendChild(magic);
        magic.addEventListener('animationend', () => magic.remove());
      }
    });
  </script>
</body>
</html>
